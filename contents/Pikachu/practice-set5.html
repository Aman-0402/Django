<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set 5 – Advanced & Mixed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at 50% -20%, #0c1a20, #000 70%); background-attachment: fixed; color: #e0e0e0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 36px; }
        .set-badge { display: inline-block; background: #0369a1; color: #fff; font-size: 0.75em; font-weight: 700; letter-spacing: 2px; padding: 4px 14px; border-radius: 20px; margin-bottom: 12px; text-transform: uppercase; }
        h1 { color: #fff; font-size: 1.9em; letter-spacing: 1px; margin-bottom: 6px; }
        .sub { color: #666; font-size: 0.9em; }
        .score-board { background: #071520; border: 1px solid #0c4a6e; border-radius: 14px; padding: 14px 28px; margin-bottom: 32px; text-align: center; font-size: 1em; color: #38bdf8; }
        .score-board span { font-weight: 700; font-size: 1.4em; color: #7dd3fc; }
        .quiz-wrapper { width: 100%; max-width: 820px; }
        .question-card { background: #060d12; border: 1px solid #0c4a6e; border-radius: 14px; padding: 26px; margin-bottom: 26px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .q-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .q-num { background: #071520; color: #38bdf8; font-size: 0.8em; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
        .q-tag { font-size: 0.72em; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .tag-django { background: #0d2218; color: #34d399; }
        .tag-flask { background: #1a0a2e; color: #c084fc; }
        .tag-mixed { background: #071520; color: #38bdf8; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: #e2e8f0; line-height: 1.55; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .option-btn { padding: 13px 18px; background: #0a1820; border: 1px solid #0c4a6e; color: #bbb; text-align: left; border-radius: 10px; cursor: pointer; font-size: 0.97rem; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: #0e2535; border-color: #0369a1; color: #fff; }
        .option-btn.correct { background: #0d2218 !important; border-color: #22c55e !important; color: #86efac !important; }
        .option-btn.incorrect { background: #1f0a0a !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        .option-btn.selected { border-color: #0ea5e9; background: #071520; color: #fff; }
        .option-btn:disabled { cursor: default; opacity: 0.75; }
        .btn-row { margin-top: 14px; display: flex; gap: 10px; }
        .submit-btn { padding: 9px 20px; background: #0369a1; border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .submit-btn:hover:not(:disabled) { background: #075985; }
        .submit-btn:disabled { opacity: 0.5; cursor: default; }
        .reset-btn { padding: 8px 16px; background: #0a1820; border: 1px solid #0c4a6e; border-radius: 8px; color: #888; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .reset-btn:hover { background: #0e2535; color: #ccc; }
        .final-score { text-align: center; margin-top: 40px; padding: 30px; background: #060d12; border: 1px solid #0c4a6e; border-radius: 18px; }
        .final-score h2 { font-size: 1.6em; color: #7dd3fc; margin-bottom: 8px; }
        .final-score p { color: #666; }
        .back-link { display: inline-block; margin-top: 24px; color: #0ea5e9; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="header">
        <div class="set-badge">Set 05 / 05</div>
        <h1>Advanced & Mixed</h1>
        <p class="sub">50 questions · Advanced level · Instant feedback</p>
    </div>
    <div class="score-board">Score: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span></div>
    <div class="quiz-wrapper" id="quiz-container"></div>
    <div class="final-score" id="finalScore" style="display:none; max-width:820px; width:100%;">
        <h2>All Sets Done! 🏆</h2>
        <p id="finalText"></p>
        <a href="./practice.html" class="back-link">← Back to Practice Sets</a>
    </div>
    <script>
    const questions = [
        { id:1, tag:"Django", text:"What does messages.success() do in Django?", options:["Saves a success log","Shows a one-time success notification to the user","Sends an email","Marks user as verified"], correct:1 },
        { id:2, tag:"Django", text:"Where should the messages display block be placed for site-wide use?", options:["In every template individually","Only in the home template","In the base template that others extend","In settings.py"], correct:2 },
        { id:3, tag:"Django", text:"What does message.tags return for a messages.error() message?", options:["'error'","'danger'","'critical'","'alert'"], correct:0 },
        { id:4, tag:"Django", text:"What Django setting maps message levels to custom CSS class strings?", options:["MESSAGE_CLASSES","ALERT_TAGS","MESSAGE_TAGS","NOTIFICATION_TAGS"], correct:2 },
        { id:5, tag:"Django", text:"What mixin adds an automatic success message to a CBV?", options:["MessageMixin","FlashMixin","AlertMixin","SuccessMessageMixin"], correct:3 },
        { id:6, tag:"Django", text:"What URL does Django's built-in admin panel run at by default?", options:["/dashboard/","/__admin__/","/manage/","/admin/"], correct:3 },
        { id:7, tag:"Django", text:"What does list_display in ModelAdmin control?", options:["Columns shown in admin list view","Display order of models","CSS layout","Which fields are editable"], correct:0 },
        { id:8, tag:"Django", text:"What does search_fields in ModelAdmin enable?", options:["Full-text search engine","A search bar in the admin list view","Elasticsearch integration","Autocomplete fields"], correct:1 },
        { id:9, tag:"Django", text:"What does list_filter in ModelAdmin add?", options:["A search bar","A sidebar filter panel","Dropdown in list","Inline edit mode"], correct:1 },
        { id:10, tag:"Django", text:"What does fieldsets in ModelAdmin do?", options:["Sets field order only","Groups fields into named sections on add/edit page","Hides certain fields","Sets field validators"], correct:1 },
        { id:11, tag:"Django", text:"What does the actions attribute in ModelAdmin define?", options:["URL actions","Bulk actions in the dropdown on list page","Admin menu items","Quick buttons on detail page"], correct:1 },
        { id:12, tag:"Django", text:"What are Django admin inlines used for?", options:["Showing related records inline on parent model's page","Embedding CSS","Inline Python execution","Showing SQL queries"], correct:0 },
        { id:13, tag:"Django", text:"What layout does TabularInline use?", options:["Full form for each related object","Stacked vertical layout","Compact table with one row per related object","Card grid layout"], correct:2 },
        { id:14, tag:"Django", text:"What does Django's Paginator class do?", options:["Paginates URLs","Splits a queryset into pages","Creates numbered links","Handles infinite scroll"], correct:1 },
        { id:15, tag:"Django", text:"What does paginator.page(n) return?", options:["Page number","A Page object for page n","A queryset for page n","Total count"], correct:1 },
        { id:16, tag:"Django", text:"What does page_obj.has_previous() return?", options:["Page number of previous page","True if a previous page exists","The previous page object","False always on page 1"], correct:1 },
        { id:17, tag:"Django", text:"What does the pre_delete signal fire on?", options:["Before a model field is changed","Before a model instance is deleted","After deletion","On queryset delete only"], correct:1 },
        { id:18, tag:"Django", text:"What is the F() expression used for in Django ORM?", options:["Filtering by field name","Referencing a field value in a query without loading to Python","Formatting output","Foreign key access"], correct:1 },
        { id:19, tag:"Django", text:"What is the Q() object used for in Django ORM?", options:["Querying with pagination","Building complex OR/AND filter conditions","Quick queries","Queue management"], correct:1 },
        { id:20, tag:"Django", text:"Which Django command checks for common project issues?", options:["python manage.py test","python manage.py validate","python manage.py check","python manage.py verify"], correct:2 },
        { id:21, tag:"Flask", text:"What are Flask Blueprints?", options:["HTML page templates","Modular components for organizing Flask routes and views","Database schemas","Configuration files"], correct:1 },
        { id:22, tag:"Flask", text:"How do you register a Flask Blueprint with the application?", options:["app.add_blueprint()","app.use_blueprint()","app.register_blueprint()","flask.register(blueprint)"], correct:2 },
        { id:23, tag:"Flask", text:"What does Blueprint('name', __name__) create?", options:["A new Flask app","A new Blueprint instance","A new URL rule","A configuration object"], correct:1 },
        { id:24, tag:"Flask", text:"What is the Flask application factory pattern?", options:["A design pattern for models","A function that creates and returns the Flask app instance","A factory class for forms","A template generator"], correct:1 },
        { id:25, tag:"Flask", text:"What is Flask's g object?", options:["The global configuration","A request-scoped temporary storage object","The database connection","The current user object"], correct:1 },
        { id:26, tag:"Flask", text:"What does @app.before_request decorator do?", options:["Runs function before importing Flask","Runs function before every incoming request","Runs function before app starts","Validates requests"], correct:1 },
        { id:27, tag:"Flask", text:"What does @app.after_request decorator do?", options:["Runs function after app shuts down","Runs function after every response","Logs after requests","Compresses responses"], correct:1 },
        { id:28, tag:"Flask", text:"What does @app.errorhandler(404) decorator do?", options:["Raises a 404 error","Logs 404 errors","Defines a custom handler function for 404 errors","Redirects 404s to home"], correct:2 },
        { id:29, tag:"Flask", text:"What is Flask-Migrate used for?", options:["User migration between apps","Database schema migrations for Flask-SQLAlchemy","File migration","Session migration"], correct:1 },
        { id:30, tag:"Flask", text:"What does flask db upgrade do?", options:["Upgrades Flask version","Applies pending migrations to the database","Creates migration scripts","Shows migration status"], correct:1 },
        { id:31, tag:"Flask", text:"What does flask db migrate do?", options:["Applies migrations","Generates a new migration script from model changes","Initializes migration directory","Shows pending migrations"], correct:1 },
        { id:32, tag:"Flask", text:"What is @app.teardown_appcontext used for?", options:["Shutting down the app","Cleanup code that runs after each request context ends","Resetting the database","Clearing caches"], correct:1 },
        { id:33, tag:"Flask", text:"What does app.config.from_object() do?", options:["Loads config from a file","Loads configuration from a Python object or class","Imports another Flask app","Reads environment variables"], correct:1 },
        { id:34, tag:"Flask", text:"How do you return JSON response in Flask?", options:["return json.dumps({})","return response('json', {})","return jsonify({})","return flask.json({})"], correct:2 },
        { id:35, tag:"Flask", text:"What does make_response() do in Flask?", options:["Makes a template","Creates a custom response object with headers/status","Makes an API call","Creates a redirect"], correct:1 },
        { id:36, tag:"Mixed", text:"Django's MVT pattern — what does the 'V' in MVT stand for?", options:["Validator","Variable","View","Virtual"], correct:2 },
        { id:37, tag:"Mixed", text:"Jinja2 filter: {{ name|upper }} does what?", options:["Converts to lowercase","Capitalizes first letter","Converts to uppercase","Strips whitespace"], correct:2 },
        { id:38, tag:"Mixed", text:"What does Django's get_object_or_404() do?", options:["Creates object if not found","Returns None if not found","Gets object or returns a 404 HTTP error","Filters objects by 404 status"], correct:2 },
        { id:39, tag:"Mixed", text:"What does select_related() do in Django ORM?", options:["Selects fields instead of objects","Performs SQL JOIN for ForeignKey to reduce database queries","Selects random records","Caches related objects"], correct:1 },
        { id:40, tag:"Mixed", text:"What does prefetch_related() do in Django ORM?", options:["Same as select_related()","Prefetches ManyToMany and reverse FK in separate queries","Caches all queries","Prefetches static files"], correct:1 },
        { id:41, tag:"Mixed", text:"What does Django's {% url 'name' %} template tag do?", options:["Fetches data from URL","Generates a URL from a named URL pattern","Links to a static file","Creates an anchor tag"], correct:1 },
        { id:42, tag:"Mixed", text:"What does QuerySet.values() return instead of model instances?", options:["A list of primary keys","Dictionaries of field values","A flat list of values","Tuples of (pk, str)"], correct:1 },
        { id:43, tag:"Mixed", text:"What is Django middleware?", options:["A database layer","Code that processes every request and response globally","A form validation layer","A caching mechanism"], correct:1 },
        { id:44, tag:"Mixed", text:"What is Flask's secret_key used for?", options:["Database encryption","Admin authentication","Session cookie signing and security","API authentication"], correct:2 },
        { id:45, tag:"Mixed", text:"What does QuerySet.count() do compared to len(QuerySet)?", options:["They are identical","count() returns count in SQL without loading objects (faster)","len() is faster","count() loads all objects first"], correct:1 },
        { id:46, tag:"Mixed", text:"What does Django's {% load static %} tag do?", options:["Loads static files into memory","Makes the static template tag available in the template","Serves static files","Compresses CSS/JS"], correct:1 },
        { id:47, tag:"Mixed", text:"In Flask, what does redirect(url_for('view_name')) do?", options:["Renders the view template","Generates and redirects to the URL of the named view","Imports the view function","Creates a shortcut"], correct:1 },
        { id:48, tag:"Mixed", text:"What does Django's collectstatic command do?", options:["Collects all models","Gathers static files from all apps into STATIC_ROOT for deployment","Validates static file paths","Minifies CSS and JS"], correct:1 },
        { id:49, tag:"Mixed", text:"What is Jinja2's |safe filter used for?", options:["Sanitizes HTML output","Marks a string as safe to render as HTML without escaping","Encrypts sensitive data","Validates URLs"], correct:1 },
        { id:50, tag:"Mixed", text:"What does Django's python manage.py shell command provide?", options:["A production REPL","An interactive Python shell with Django project loaded","A database shell","A template testing shell"], correct:1 }
    ];

    let score = 0, answered = 0;
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q' + q.id;
            card.innerHTML = `<div class="q-header"><span class="q-num">Q${q.id}</span><span class="q-tag tag-${q.tag.toLowerCase()}">${q.tag}</span></div><div class="question-text">${q.text}</div><div class="options-grid">${q.options.map((opt,i)=>`<button type="button" class="option-btn" data-qid="${q.id}" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}</div><div class="btn-row"><button type="button" class="submit-btn" id="sub${q.id}" disabled>Check Answer</button><button type="button" class="reset-btn" id="res${q.id}">Reset</button></div>`;
            container.appendChild(card);
        });
        document.getElementById('totalDisplay').textContent = questions.length;
        attachEvents();
    }
    function attachEvents() {
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.dataset.qid;
                document.getElementById('q'+qid).querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
                this.classList.add('selected');
                document.getElementById('sub'+qid).disabled = false;
            });
        });
        document.querySelectorAll('.submit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.id.replace('sub','');
                const q = questions.find(x=>x.id==qid);
                const card = document.getElementById('q'+qid);
                const selected = card.querySelector('.option-btn.selected');
                if (!selected) return;
                const idx = parseInt(selected.dataset.idx);
                card.querySelectorAll('.option-btn').forEach(b=>{
                    b.disabled=true;
                    const i=parseInt(b.dataset.idx);
                    if(i===q.correct) b.classList.add('correct');
                    else if(b===selected&&i!==q.correct) b.classList.add('incorrect');
                });
                if(idx===q.correct) score++;
                answered++;
                document.getElementById('scoreDisplay').textContent = score;
                this.disabled = true;
                if(answered===questions.length) showFinal();
            });
        });
        document.querySelectorAll('.reset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.id.replace('res','');
                const card = document.getElementById('q'+qid);
                card.querySelectorAll('.option-btn').forEach(b=>{b.disabled=false;b.classList.remove('selected','correct','incorrect');});
                document.getElementById('sub'+qid).disabled = true;
            });
        });
    }
    function showFinal() {
        const pct = Math.round((score/questions.length)*100);
        document.getElementById('finalText').textContent = `You scored ${score} out of ${questions.length} (${pct}%). ${pct>=80?'🔥 Excellent!':pct>=60?'👍 Good job!':'📚 Keep practising!'}`;
        const el = document.getElementById('finalScore');
        el.style.display = 'block';
        el.scrollIntoView({behavior:'smooth'});
    }
    renderQuiz();
    </script>
</body>
</html>
