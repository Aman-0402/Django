<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set 4 – Authentication & Profiles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at 50% -20%, #431407, #000 70%); background-attachment: fixed; color: #e0e0e0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 36px; }
        .set-badge { display: inline-block; background: #c2410c; color: #fff; font-size: 0.75em; font-weight: 700; letter-spacing: 2px; padding: 4px 14px; border-radius: 20px; margin-bottom: 12px; text-transform: uppercase; }
        h1 { color: #fff; font-size: 1.9em; letter-spacing: 1px; margin-bottom: 6px; }
        .sub { color: #666; font-size: 0.9em; }
        .score-board { background: #1c0a04; border: 1px solid #7c2d12; border-radius: 14px; padding: 14px 28px; margin-bottom: 32px; text-align: center; font-size: 1em; color: #fb923c; }
        .score-board span { font-weight: 700; font-size: 1.4em; color: #fdba74; }
        .quiz-wrapper { width: 100%; max-width: 820px; }
        .question-card { background: #110604; border: 1px solid #7c2d12; border-radius: 14px; padding: 26px; margin-bottom: 26px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .q-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .q-num { background: #1c0a04; color: #fb923c; font-size: 0.8em; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
        .q-tag { font-size: 0.72em; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .tag-django { background: #0d2218; color: #34d399; }
        .tag-flask { background: #1a0a2e; color: #c084fc; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: #e2e8f0; line-height: 1.55; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .option-btn { padding: 13px 18px; background: #160804; border: 1px solid #7c2d12; color: #bbb; text-align: left; border-radius: 10px; cursor: pointer; font-size: 0.97rem; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background: #1c0e08; border-color: #c2410c; color: #fff; }
        .option-btn.correct { background: #0d2218 !important; border-color: #22c55e !important; color: #86efac !important; }
        .option-btn.incorrect { background: #1f0a0a !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        .option-btn.selected { border-color: #f97316; background: #1c0a04; color: #fff; }
        .option-btn:disabled { cursor: default; opacity: 0.75; }
        .btn-row { margin-top: 14px; display: flex; gap: 10px; }
        .submit-btn { padding: 9px 20px; background: #c2410c; border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .submit-btn:hover:not(:disabled) { background: #9a3412; }
        .submit-btn:disabled { opacity: 0.5; cursor: default; }
        .reset-btn { padding: 8px 16px; background: #160804; border: 1px solid #7c2d12; border-radius: 8px; color: #888; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .reset-btn:hover { background: #1c0e08; color: #ccc; }
        .final-score { text-align: center; margin-top: 40px; padding: 30px; background: #110604; border: 1px solid #7c2d12; border-radius: 18px; }
        .final-score h2 { font-size: 1.6em; color: #fdba74; margin-bottom: 8px; }
        .final-score p { color: #666; }
        .back-link { display: inline-block; margin-top: 24px; color: #f97316; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #fb923c; }
    </style>
</head>
<body>
    <div class="header">
        <div class="set-badge">Set 04 / 05</div>
        <h1>Authentication & Profiles</h1>
        <p class="sub">50 questions · Intermediate level · Instant feedback</p>
    </div>
    <div class="score-board">Score: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span></div>
    <div class="quiz-wrapper" id="quiz-container"></div>
    <div class="final-score" id="finalScore" style="display:none; max-width:820px; width:100%;">
        <h2>Set Complete! 🎉</h2>
        <p id="finalText"></p>
        <a href="./practice.html" class="back-link">← Back to Practice Sets</a>
    </div>
    <script>
    const questions = [
        { id:1, tag:"Django", text:"What module provides Django's built-in authentication system?", options:["django.auth","django.contrib.sessions","django.contrib.auth","django.security"], correct:2 },
        { id:2, tag:"Django", text:"What is the built-in user model class in Django?", options:["Account","Person","Profile","User"], correct:3 },
        { id:3, tag:"Django", text:"What method creates a Django user with a properly hashed password?", options:["User.objects.create()","User.create_user()","User.objects.create_user()","User.new()"], correct:2 },
        { id:4, tag:"Django", text:"What method creates a Django superuser with all permissions?", options:["User.objects.create_admin()","User.objects.create_superuser()","User.objects.make_superuser()","User.superuser()"], correct:1 },
        { id:5, tag:"Django", text:"What function checks user credentials and returns a user object in Django?", options:["login()","check_user()","verify()","authenticate()"], correct:3 },
        { id:6, tag:"Django", text:"What function logs in a user (creates session) in Django?", options:["auth()","session()","login()","start_session()"], correct:2 },
        { id:7, tag:"Django", text:"What function logs out a user (destroys session) in Django?", options:["logout()","end_session()","deauth()","signout()"], correct:0 },
        { id:8, tag:"Django", text:"What decorator protects a Django Function-Based View with login?", options:["@require_login","@auth_required","@login_required","@session_required"], correct:2 },
        { id:9, tag:"Django", text:"What mixin protects a Django Class-Based View with login?", options:["AuthMixin","SessionMixin","LoginMixin","LoginRequiredMixin"], correct:3 },
        { id:10, tag:"Django", text:"What Django setting defines where to redirect after successful login?", options:["LOGIN_URL","AUTH_REDIRECT","LOGIN_REDIRECT_URL","SUCCESS_URL"], correct:2 },
        { id:11, tag:"Django", text:"What Django setting defines where to redirect after logout?", options:["LOGOUT_REDIRECT_URL","AFTER_LOGOUT","LOGOUT_URL","SESSION_END_URL"], correct:0 },
        { id:12, tag:"Django", text:"What Django setting defines the URL of the login page?", options:["AUTH_URL","SIGNIN_URL","LOGIN_PAGE","LOGIN_URL"], correct:3 },
        { id:13, tag:"Django", text:"How do you access the logged-in user in a Django view?", options:["session.user","current_user","request.user","auth.user"], correct:2 },
        { id:14, tag:"Django", text:"How do you check if the current user is authenticated in Django?", options:["request.user.is_logged_in","request.user.logged_in","request.user.is_authenticated","request.is_auth"], correct:2 },
        { id:15, tag:"Django", text:"What built-in Django form handles user registration with password matching?", options:["RegisterForm","SignupForm","UserCreationForm","AuthForm"], correct:2 },
        { id:16, tag:"Django", text:"What built-in Django view handles the login page?", options:["AuthView","SigninView","LoginPage","LoginView"], correct:3 },
        { id:17, tag:"Django", text:"What built-in Django view handles logout?", options:["SignoutView","DeauthView","LogoutView","SessionEndView"], correct:2 },
        { id:18, tag:"Django", text:"What does is_staff=True mean on a Django User object?", options:["User is a superuser","User can access /admin/","User has all permissions","User is a moderator"], correct:1 },
        { id:19, tag:"Django", text:"What does is_superuser=True mean on a Django User?", options:["User can access /admin/","User is a staff member","User has all permissions regardless of assignments","User created the project"], correct:2 },
        { id:20, tag:"Django", text:"What does set_password() do on a Django User instance?", options:["Prompts user to change password","Sets password as plain text","Sets password with automatic hashing","Resets password to default"], correct:2 },
        { id:21, tag:"Django", text:"After calling set_password(), what keeps the current user session valid?", options:["login(request, user)","session.refresh()","update_session_auth_hash(request, user)","request.session.save()"], correct:2 },
        { id:22, tag:"Django", text:"What password hashing algorithm does Django use by default?", options:["bcrypt","MD5","SHA1","PBKDF2 + SHA256"], correct:3 },
        { id:23, tag:"Django", text:"What is password1 field in Django's UserCreationForm?", options:["Old password","Confirm password","Enter new password","Encrypted password"], correct:2 },
        { id:24, tag:"Django", text:"How do you access a user in a template without passing explicitly?", options:["It's not possible","Via request.user in template","Via {{ user }} — Django adds it automatically via context processors","Via {% load user %}"], correct:2 },
        { id:25, tag:"Django", text:"What does {% if user.is_authenticated %} check in a Django template?", options:["If user object exists","If user has admin access","If the current user is logged in","If user has verified email"], correct:2 },
        { id:26, tag:"Django", text:"What field links a Profile model to User with a one-to-one relationship?", options:["ForeignKey","ManyToManyField","OneToOneField","PrimaryKey"], correct:2 },
        { id:27, tag:"Django", text:"What happens to a Profile when its related User is deleted (with CASCADE)?", options:["Profile is kept","Profile is set to NULL","Profile is also deleted","An error is raised"], correct:2 },
        { id:28, tag:"Django", text:"What Django signal fires after every model save() call?", options:["pre_save","after_save","model_saved","post_save"], correct:3 },
        { id:29, tag:"Django", text:"What decorator connects a function to a Django signal?", options:["@signal()","@connect()","@receiver()","@listen()"], correct:2 },
        { id:30, tag:"Django", text:"What does the created parameter in post_save signal indicate?", options:["True if record was updated","True if record is newly created","True if save was successful","True if user is logged in"], correct:1 },
        { id:31, tag:"Django", text:"How do you auto-create a Profile whenever a new User registers?", options:["Override User.save()","Use post_save signal on User model","Override UserCreationForm","Use a middleware"], correct:1 },
        { id:32, tag:"Django", text:"How do you access a user's profile from a request in Django?", options:["request.profile","Profile.get(request.user)","request.user.profile","get_profile(request.user)"], correct:2 },
        { id:33, tag:"Django", text:"Where do you import signals to make them load on app startup?", options:["In settings.py","In urls.py","In models.py","In AppConfig.ready() method in apps.py"], correct:3 },
        { id:34, tag:"Django", text:"What model field stores an image file in Django?", options:["FileField","PhotoField","BinaryField","ImageField"], correct:3 },
        { id:35, tag:"Django", text:"What Python library is required to use Django's ImageField?", options:["ImageMagick","OpenCV","Pillow","python-pil"], correct:2 },
        { id:36, tag:"Django", text:"What does upload_to='avatars/' parameter do in ImageField?", options:["Sets URL prefix for images","Sets directory to store uploaded files in MEDIA_ROOT","Sets file size limit","Sets allowed image types"], correct:1 },
        { id:37, tag:"Django", text:"How do you access an uploaded image's URL in a Django template?", options:["{{ obj.image }}","{{ obj.image.path }}","{{ obj.image.src }}","{{ obj.image.url }}"], correct:3 },
        { id:38, tag:"Django", text:"What setting defines where uploaded files are stored on disk?", options:["FILE_ROOT","UPLOAD_DIR","MEDIA_ROOT","STATIC_ROOT"], correct:2 },
        { id:39, tag:"Django", text:"What setting defines the URL prefix for accessing uploaded files?", options:["MEDIA_URL","FILE_URL","UPLOAD_URL","STATIC_URL"], correct:0 },
        { id:40, tag:"Django", text:"What does request.FILES contain in a Django view?", options:["GET parameters","POST text data","Uploaded file objects","Session files"], correct:1 },
        { id:41, tag:"Flask", text:"What Flask extension is commonly used for user authentication?", options:["Flask-Auth","Flask-Session","Flask-Login","Flask-Security"], correct:2 },
        { id:42, tag:"Flask", text:"What mixin must Flask-Login user models include?", options:["AuthMixin","LoginMixin","SessionMixin","UserMixin"], correct:3 },
        { id:43, tag:"Flask", text:"What function logs in a user in Flask-Login?", options:["auth_user()","session.login()","login_user()","flask_login()"], correct:2 },
        { id:44, tag:"Flask", text:"What function logs out a user in Flask-Login?", options:["deauth_user()","session.logout()","signout_user()","logout_user()"], correct:3 },
        { id:45, tag:"Flask", text:"What decorator protects a Flask view with Flask-Login?", options:["@require_auth","@auth_required","@login_required","@session_required"], correct:2 },
        { id:46, tag:"Flask", text:"How do you access the currently logged-in user in Flask-Login?", options:["request.user","session.user","g.user","current_user"], correct:3 },
        { id:47, tag:"Flask", text:"What is the user_loader callback used for in Flask-Login?", options:["Loads all users","Loads a user from the database by ID from the session","Validates login credentials","Creates a new user"], correct:1 },
        { id:48, tag:"Flask", text:"What decorator registers the Flask-Login user_loader function?", options:["@login_manager.load_user","@flask_login.user_loader","@login_manager.user_loader","@app.user_loader"], correct:2 },
        { id:49, tag:"Flask", text:"What does current_user.is_authenticated return in Flask-Login?", options:["True if user has admin role","True if user is logged in","True if user has verified email","True if user exists in DB"], correct:1 },
        { id:50, tag:"Flask", text:"What class initializes the Flask-Login extension?", options:["FlaskLogin","AuthManager","LoginExtension","LoginManager"], correct:3 }
    ];

    let score = 0, answered = 0;
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q' + q.id;
            card.innerHTML = `<div class="q-header"><span class="q-num">Q${q.id}</span><span class="q-tag tag-${q.tag.toLowerCase()}">${q.tag}</span></div><div class="question-text">${q.text}</div><div class="options-grid">${q.options.map((opt,i)=>`<button type="button" class="option-btn" data-qid="${q.id}" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}</div><div class="btn-row"><button type="button" class="submit-btn" id="sub${q.id}" disabled>Check Answer</button><button type="button" class="reset-btn" id="res${q.id}">Reset</button></div>`;
            container.appendChild(card);
        });
        document.getElementById('totalDisplay').textContent = questions.length;
        attachEvents();
    }
    function attachEvents() {
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.dataset.qid;
                document.getElementById('q'+qid).querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
                this.classList.add('selected');
                document.getElementById('sub'+qid).disabled = false;
            });
        });
        document.querySelectorAll('.submit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.id.replace('sub','');
                const q = questions.find(x=>x.id==qid);
                const card = document.getElementById('q'+qid);
                const selected = card.querySelector('.option-btn.selected');
                if (!selected) return;
                const idx = parseInt(selected.dataset.idx);
                card.querySelectorAll('.option-btn').forEach(b=>{
                    b.disabled=true;
                    const i=parseInt(b.dataset.idx);
                    if(i===q.correct) b.classList.add('correct');
                    else if(b===selected&&i!==q.correct) b.classList.add('incorrect');
                });
                if(idx===q.correct) score++;
                answered++;
                document.getElementById('scoreDisplay').textContent = score;
                this.disabled = true;
                if(answered===questions.length) showFinal();
            });
        });
        document.querySelectorAll('.reset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const qid = this.id.replace('res','');
                const card = document.getElementById('q'+qid);
                card.querySelectorAll('.option-btn').forEach(b=>{b.disabled=false;b.classList.remove('selected','correct','incorrect');});
                document.getElementById('sub'+qid).disabled = true;
            });
        });
    }
    function showFinal() {
        const pct = Math.round((score/questions.length)*100);
        document.getElementById('finalText').textContent = `You scored ${score} out of ${questions.length} (${pct}%). ${pct>=80?'🔥 Excellent!':pct>=60?'👍 Good job!':'📚 Keep practising!'}`;
        const el = document.getElementById('finalScore');
        el.style.display = 'block';
        el.scrollIntoView({behavior:'smooth'});
    }
    renderQuiz();
    </script>
</body>
</html>
